name: Get MTN API Key
on:
  workflow_dispatch: # This adds a manual play button on GitHub

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Network Requests Library
        run: pip install requests

      - name: Execute MTN Connection Script
        run: python mtn_connect.py
